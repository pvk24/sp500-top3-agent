# Daily S&P 500 screen on GitHub's servers: no laptop needed.
# Runs Tuesday to Saturday at 03:30 UTC (9:00 AM IST), after each US trading day, and saves the results to data/live/.
# GitHub may start scheduled jobs a little late at busy times. You can also run it by hand from the Actions tab.
name: Daily screen

on:
  schedule:
    - cron: '30 3 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r collector/requirements.txt
      - name: Collect, score and backtest
        run: python collector/run_daily.py
      - name: Save results
        run: |
          git config user.name "sp500-top3-agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet || git commit -m "Daily screen $(date -u +%Y-%m-%d)"
          git push
